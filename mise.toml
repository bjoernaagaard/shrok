[tools]
node = "26.12.1"
pnpm = "12.15.0"
"github:cachix/secretspec" = "0.21.1"
bitwarden-secrets-manager = "2.1.0"
"npm:@xdevplatform/xurl" = "1.3.4"
"npm:@googleworkspace/cli" = "0.22.5"
"github:h4ckf0r0day/obscura" = "0.2.5"
"go:github.com/f1bonacc1/process-compose" = "1.122.0"

[env]
PC_PORT_NUM = "8731"
SHROK_MCP_CONFIG = "{{config_root}}/mcp.json"

[tasks.start]
description = "Start Shrok in the background under process-compose, with secrets from Bitwarden Secrets Manager"
run = "process-compose up --detached"

[tasks.stop]
description = "Stop Shrok and process-compose"
run = "process-compose down"
