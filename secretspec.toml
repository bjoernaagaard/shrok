[project]
name = "shrok"
revision = "1.0"

[profiles.default]
ANTHROPIC_API_KEY = { description = "Anthropic API key. Shrok needs this or OPENAI_API_KEY.", required = false }
ANTHROPIC_BASE_URL = { description = "Anthropic API base URL, when not https://api.anthropic.com", required = false }
OPENAI_API_KEY = { description = "OpenAI API key. Shrok needs this or ANTHROPIC_API_KEY.", required = false }
OPENAI_BASE_URL = { description = "OpenAI API base URL, when not https://api.openai.com/v1", required = false }
GOOGLE_WORKSPACE_CLI_CLIENT_ID = { description = "Google Desktop OAuth client ID, read by gws", required = false, ref = { item = "GOOGLE_OAUTH_CLIENT_ID" } }
GOOGLE_WORKSPACE_CLI_CLIENT_SECRET = { description = "Google Desktop OAuth client secret, read by gws", required = false, ref = { item = "GOOGLE_OAUTH_CLIENT_SECRET" } }
XURL_CLIENT_ID = { description = "X OAuth client ID, read by xurl", required = false }
XURL_CLIENT_SECRET = { description = "X OAuth client secret, read by xurl", required = false }
TYPESAFE_API_KEY = { description = "TypeSafe API key for its Jev model, which judges risky actions such as bash commands", required = false }
